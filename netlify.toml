[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/&"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "https://lap-docs.netlify.app/*"
  to = "https://lap.onl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lap.onl/*"
  to = "https://lap.onl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lap.onl/*"
  to = "https://lap.onl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lap.onl/*"
  to = "https://lap.onl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/magazine"
  to = "/posts"
  status = 301

[[redirects]]
  from = "/magazine/*"
  to = "/posts/:splat"
  status = 301

[[redirects]]
  from = "/articles"
  to = "/posts"
  status = 301

[[redirects]]
  from = "/articles/*"
  to = "/posts/:splat"
  status = 301

[[redirects]]
  from = "/article/*"
  to = "/posts/:splat"
  status = 301

[[redirects]]
  from = "/authors"
  to = "/team"
  status = 301

[[redirects]]
  from = "/authors/*"
  to = "/team/:splat"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/topics/:splat"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/topics/:splat"
  status = 301
